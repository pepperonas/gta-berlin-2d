<!doctype html><html lang="de"><meta charset="utf-8"><title>Berlin · Grafikvergleich</title>
<style>body{margin:0;background:#101820;color:#e7ecec;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center}select,button{font:inherit;padding:6px;color:inherit;background:#25353f;border:1px solid #64767b;border-radius:4px}canvas{display:block;width:100%;height:auto}output{margin-left:auto}p{margin:8px 12px;color:#9fb2bb}</style>
<header><strong>Berlin · Grafikvergleich</strong><select aria-label="Szene" id="scene"><option value="block">Häuserblock · Mittag</option><option value="avenue">Boulevard · Abend</option><option value="park">Park · Sonne</option><option value="water">Spree · Abend</option><option value="rain">Kiez · Regennacht</option><option value="snow">Kiez · Schnee</option><option value="station">U-Bahn · Innenraum</option></select><select aria-label="Perspektive" id="zoom"><option value="1.2">Fahren</option><option value="2">Zu Fuß</option></select><select aria-label="Qualität" id="quality"><option value="high">Hoch</option><option value="low">Niedrig</option></select><button id="motion">Bewegung abspielen</button><button id="measure">120 Bilder messen</button><button id="profile">Renderprofil</button><button id="suite">Alle Szenen messen</button><button id="save">PNG speichern</button><output id="status">Lädt …</output></header>
<pre id="results" style="white-space:pre-wrap;margin:8px 12px"></pre><canvas width="1920" height="1080" aria-label="Grafikvergleich"></canvas><p>Feste Kamera, Seed 1989, Spielzeit 120 s. Messung: Render-CPU-Zeit ohne Simulation und Browser-Compositing, 30 Aufwärmbilder + 120 Messbilder. Kein Zugriff auf Spielstände.</p>
<script type="module">if (['localhost','127.0.0.1'].includes(location.hostname)) import('./src/graphics-review.js'); else document.body.textContent = 'Diese Entwicklungsseite ist nur lokal verfügbar.';</script></html>
